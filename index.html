<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Critical Thinking & AI Ethics Toolkit | St. Ambrose University</title>
  <meta name="description" content="A student-facing AI ethics toolkit created for PHIL 102 at St. Ambrose University." />
  <!-- Browser tab icon pulled from the SAU site favicon. Replace favicon.ico if the group chooses a different icon. -->
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="shortcut icon" href="favicon.ico" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <!--
    SAU AI Ethics Toolkit
    Editing notes:
    - Page structure lives here in index.html.
    - Styling lives in assets/css/styles.css.
    - Interactive behavior lives in assets/js/main.js.
    - Most editable site content lives in content/content.json.
    - Deploy through Cloudflare Pages and view the live HTTPS URL.
  -->

  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header class="mobile-topbar">
    <button class="menu-toggle" id="menu-toggle" aria-label="Open navigation" aria-expanded="false">
      ☰ Menu
    </button>
    <span class="mobile-title">AI Ethics Toolkit</span>
  </header>

  <aside class="sidebar" id="sidebar" aria-label="Site navigation">
    <div class="sidebar-header">
      <!-- Replace this image if the group chooses a different final brand mark. -->
      <img src="assets/img/sau-shield.png" alt="St. Ambrose University shield" class="sidebar-badge" />
      <h1>St. Ambrose University</h1>
      <p>Critical Thinking & AI Ethics Toolkit</p>
      <p class="sidebar-note">Student resource guide</p>
    </div>

    <!-- Navigation is generated from content/content.json by main.js. -->
    <nav id="sidebar-nav" class="sidebar-nav" aria-label="Toolkit sections"></nav>
  </aside>

  <main class="main-content" id="main-content">
    <!-- Main content is generated from content/content.json by main.js. -->
    <div id="content-root" class="content-root">
      <section class="loading-card" aria-live="polite">
        <h2>Loading AI Ethics Toolkit...</h2>
        <p>If this message does not disappear, check that content/content.json is present and that the site has deployed correctly.</p>
      </section>
    </div>
  </main>

  <button id="back-to-top" class="back-to-top" type="button" aria-label="Back to top">↑</button>

  <script src="assets/js/main.js"></script>
</body>
</html>
